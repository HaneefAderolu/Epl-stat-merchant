<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPL Analyst</title>
<style>
  :root {
    --pitch: #0E3B2C;
    --pitch-dark: #0A2C21;
    --pitch-panel: #123C2D;
    --chalk: #F3F1E7;
    --chalk-dim: #B9C7BC;
    --amber: #E4A945;
    --amber-dim: #a9832e;
    --rule: #2C5945;
    --danger: #E4674A;
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--pitch-dark);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-image:
      repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.015) 0px,
        rgba(255,255,255,0.015) 2px,
        transparent 2px,
        transparent 68px
      );
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }

  header.masthead {
    padding: 32px 4px 18px;
    border-bottom: 1px solid var(--rule);
  }

  header.masthead .kicker {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--amber);
    margin: 0 0 6px;
  }

  header.masthead h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.01em;
    margin: 0 0 8px;
    color: var(--chalk);
  }

  header.masthead p.sub {
    margin: 0;
    color: var(--chalk-dim);
    font-size: 14.5px;
    line-height: 1.5;
    max-width: 56ch;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 4px 4px;
  }

  .chip {
    background: var(--pitch-panel);
    border: 1px solid var(--rule);
    color: var(--chalk-dim);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    text-align: left;
  }

  .chip:hover {
    border-color: var(--amber-dim);
    color: var(--chalk);
  }

  main#log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .row.system { justify-content: center; }

  .bubble {
    max-width: 82%;
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .bubble.user {
    background: var(--amber);
    color: #241a06;
    border-bottom-right-radius: 2px;
  }

  .bubble.assistant {
    background: var(--pitch-panel);
    border: 1px solid var(--rule);
    color: var(--chalk);
    border-bottom-left-radius: 2px;
  }

  .bubble.error {
    background: rgba(228, 103, 74, 0.12);
    border: 1px solid var(--danger);
    color: #f2b8ab;
  }

  .bubble.system-note {
    background: transparent;
    color: var(--chalk-dim);
    font-size: 12.5px;
    font-style: italic;
    padding: 2px 8px;
  }

  .sql-toggle {
    margin-top: 8px;
    display: inline-block;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--chalk-dim);
    cursor: pointer;
    border-bottom: 1px dotted var(--rule);
  }

  .sql-toggle:hover { color: var(--amber); }

  .sql-block {
    display: none;
    margin-top: 8px;
    padding: 10px 12px;
    background: #081F17;
    border: 1px solid var(--rule);
    border-radius: 3px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 12px;
    color: #9fd6b5;
    overflow-x: auto;
  }

  .sql-block.open { display: block; }
  .sql-block div + div { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--rule); }

  .thinking {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .thinking span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber-dim);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 4px 22px;
    border-top: 1px solid var(--rule);
  }

  #composer input {
    flex: 1;
    background: var(--pitch-panel);
    border: 1px solid var(--rule);
    color: var(--chalk);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 3px;
    outline: none;
  }

  #composer input::placeholder { color: #7d9186; }
  #composer input:focus { border-color: var(--amber-dim); }

  #composer button {
    background: var(--amber);
    color: #241a06;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 3px;
    cursor: pointer;
  }

  #composer button:disabled {
    background: var(--amber-dim);
    cursor: not-allowed;
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .thinking span { animation: none; opacity: 1; }
  }

  ::selection { background: var(--amber); color: #241a06; }
</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="kicker">MATCHDAY DATA · 1992/93 &ndash; 2025/26</p>
      <h1>EPL Analyst</h1>
      <p class="sub">Ask about any Premier League table, matchday, scoreline, top scorer, assist, or booking from 34 seasons. Answers are pulled live from the match-by-match dataset, not recalled from memory.</p>
    </header>

    <div class="chips" id="chips">
      <button class="chip" type="button">Who won the Golden Boot in 1993/94?</button>
      <button class="chip" type="button">What was Arsenal's points total after matchday 20 in 1998/99?</button>
      <button class="chip" type="button">Man United's results in April 2013</button>
      <button class="chip" type="button">Most red cards by a player in the 2000s</button>
    </div>

    <main id="log">
      <div class="row system"><div class="bubble system-note">Ask a question below to get started.</div></div>
    </main>

    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="e.g. Where did Leeds finish in 1999/2000?" />
      <button id="send" type="submit">Ask</button>
    </form>
  </div>

<script>
  const API_BASE = window.location.origin; // backend serves this file, so same-origin
  const log = document.getElementById('log');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chips = document.getElementById('chips');

  let sessionId = localStorage.getItem('epl_session_id') || null;

  function scrollToBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function addBubble(role, text, opts = {}) {
    const row = document.createElement('div');
    row.className = 'row ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role + (opts.error ? ' error' : '');
    bubble.textContent = text;
    row.appendChild(bubble);

    if (opts.sql && opts.sql.length) {
      const toggle = document.createElement('span');
      toggle.className = 'sql-toggle';
      toggle.textContent = 'view SQL used (' + opts.sql.length + ')';
      const block = document.createElement('div');
      block.className = 'sql-block';
      block.innerHTML = opts.sql.map(q => '<div>' + escapeHtml(q) + '</div>').join('');
      toggle.addEventListener('click', () => block.classList.toggle('open'));
      bubble.appendChild(toggle);
      bubble.appendChild(block);
    }

    log.appendChild(row);
    scrollToBottom();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'thinking-row';
    row.innerHTML = '<div class="bubble assistant"><div class="thinking"><span></span><span></span><span></span></div></div>';
    log.appendChild(row);
    scrollToBottom();
  }

  function removeThinking() {
    const el = document.getElementById('thinking-row');
    if (el) el.remove();
  }

  async function sendMessage(text) {
    addBubble('user', text);
    input.value = '';
    sendBtn.disabled = true;
    addThinking();

    try {
      const res = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      removeThinking();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addBubble('assistant', err.detail || ('Server error (' + res.status + ')'), { error: true });
        return;
      }

      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('epl_session_id', sessionId);
      addBubble('assistant', data.answer, { sql: data.sql });
    } catch (e) {
      removeThinking();
      addBubble('assistant', 'Could not reach the backend. Is it running?', { error: true });
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });

  chips.addEventListener('click', (e) => {
    if (e.target.matches('.chip')) {
      sendMessage(e.target.textContent);
    }
  });
</script>
</body>
</html>
